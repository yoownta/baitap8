spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=baitap8;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234@a$
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Tắt tự động snake_case để map đúng với tên cột
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Bật GraphiQL UI để test query trực tiếp
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

server.port=8088
